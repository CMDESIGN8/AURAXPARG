<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA XP | Training Systems</title>
<meta name="description" content="Kits de entrenamiento de futsal AURA XP: equipamiento físico y programas digitales para trabajar coordinación, velocidad, agilidad y técnica.">
<meta name="theme-color" content="#070b12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--panel:#101a27;--panel2:#142235;--cyan:#08c9f4;--lime:#b7ff3c;--white:#f4f7fb;--muted:#a1afbf;--line:rgba(255,255,255,.12);--ink:#061019}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{background:var(--bg);color:var(--white);font-family:Montserrat,Arial,sans-serif;line-height:1.55;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,a{-webkit-tap-highlight-color:transparent}
.topline{padding:9px 16px;text-align:center;background:var(--cyan);color:var(--ink);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,22px);border-bottom:1px solid var(--line);background:rgba(7,11,18,.92);position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}
.brand{font-size:23px;font-weight:900;letter-spacing:-.07em}.brand span{color:var(--cyan)}
nav{display:flex;gap:26px;align-items:center;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
nav a{transition:color .2s ease}nav a:hover{color:var(--cyan)}
.nav-home{border:1px solid rgba(8,201,244,.5);padding:10px 14px}
.hero{position:relative;isolation:isolate;overflow:hidden;padding:100px 22px 86px;text-align:center;background:radial-gradient(ellipse at 50% 5%,rgba(8,201,244,.2),transparent 53%),linear-gradient(180deg,#0d1b2b 0%,#080e18 72%,var(--bg) 100%)}
.hero:before,.hero:after{content:"";position:absolute;z-index:-1;pointer-events:none;width:340px;height:150px;border:2px solid rgba(8,201,244,.12);transform:rotate(-24deg);filter:blur(.2px)}
.hero:before{left:-190px;top:55px;box-shadow:0 0 0 8px rgba(8,201,244,.025),0 0 0 17px rgba(8,201,244,.02)}
.hero:after{right:-190px;bottom:15px;border-color:rgba(183,255,60,.13);transform:rotate(24deg)}
.hero-inner{width:min(950px,100%);margin:auto}
.kicker{font-size:10px;font-weight:900;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
.hero-stamp{display:inline-block;margin-bottom:20px;padding:8px 13px;border:1px solid rgba(183,255,60,.5);color:var(--lime);font-family:"Permanent Marker",cursive;font-size:13px;transform:rotate(-2deg);box-shadow:3px 3px 0 rgba(183,255,60,.12)}
h1{font-size:clamp(43px,7.4vw,86px);line-height:.91;letter-spacing:-.075em;margin:16px auto 22px;font-weight:900;text-transform:uppercase}
h1 span{color:var(--cyan);text-shadow:0 0 30px rgba(8,201,244,.18)}
.hero-copy{max-width:670px;margin:0 auto;color:#c0cbd7;font-size:clamp(14px,1.5vw,16px)}
.hero-copy strong{color:var(--white)}
.hero-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{min-height:52px;padding:0 25px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;transition:transform .22s ease,background .22s ease,box-shadow .22s ease,border-color .22s ease}
.btn-main{background:var(--cyan);color:var(--ink);box-shadow:0 8px 24px rgba(8,201,244,.18)}
.btn-main:after{content:"↘";font-size:16px}.btn-main:hover{background:var(--lime);transform:translateY(-3px);box-shadow:0 10px 28px rgba(183,255,60,.16)}
.btn-ghost{border:1px solid rgba(255,255,255,.22);color:var(--white)}.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-3px)}
.wrap{width:min(1160px,calc(100% - 44px));margin:auto}
.intro{padding:76px 0 28px;display:flex;align-items:end;justify-content:space-between;gap:30px}
.intro h2{font-size:clamp(29px,4vw,45px);line-height:.98;letter-spacing:-.06em;margin-top:12px}
.intro p{max-width:420px;color:var(--muted);font-size:13px}
.choose-note{display:block;color:var(--lime);font-size:11px;font-weight:800;margin-top:10px;letter-spacing:.02em}
@keyframes auraRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.hero-inner{animation:auraRise .7s ease both}
.card{animation:auraRise .55s ease both}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.intro .scribble{display:inline-block;color:var(--lime);font-family:"Permanent Marker",cursive;font-size:clamp(18px,2vw,24px);transform:rotate(-2deg);margin-top:13px}
.systems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:18px 0 78px;align-items:stretch}
.card{position:relative;isolation:isolate;overflow:hidden;min-width:0;display:flex;flex-direction:column;background:linear-gradient(155deg,#152438,#0c1521 76%);border:1px solid var(--line);transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}
.card:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 80% 8%,rgba(8,201,244,.12),transparent 36%);opacity:.8}
.card:hover{transform:translateY(-7px);border-color:rgba(8,201,244,.5);box-shadow:0 16px 36px rgba(0,0,0,.25)}
.card:focus-within{border-color:var(--lime);box-shadow:0 0 0 2px rgba(183,255,60,.12),0 18px 38px rgba(0,0,0,.3)}
.card.featured{border-color:rgba(8,201,244,.8);box-shadow:0 0 38px rgba(8,201,244,.1)}
.card.featured:after{content:"MÁS COMPLETO";position:absolute;z-index:3;top:18px;right:-31px;padding:7px 38px;background:var(--lime);color:var(--ink);font-size:8px;font-weight:900;letter-spacing:.12em;transform:rotate(39deg)}
.visual{height:205px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,rgba(8,201,244,.19),transparent 56%),linear-gradient(135deg,#0a1522,#101f31)}
.visual:before{content:"";position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(135deg,transparent 0 17px,rgba(255,255,255,.08) 18px,transparent 19px 35px)}
.visual:after{content:"";position:absolute;left:10%;right:10%;bottom:24px;height:3px;background:var(--cyan);transform:rotate(-3deg);box-shadow:0 0 14px rgba(8,201,244,.45)}
.card:nth-child(2) .visual:after{background:var(--lime);box-shadow:0 0 14px rgba(183,255,60,.35)}
.visual .number{position:relative;z-index:1;font-size:clamp(78px,9vw,112px);font-weight:900;line-height:1;letter-spacing:-.12em;color:rgba(235,248,255,.94);text-shadow:5px 5px 0 rgba(8,201,244,.22),0 0 35px rgba(8,201,244,.2)}
.card:nth-child(2) .number{color:var(--lime);text-shadow:5px 5px 0 rgba(8,201,244,.2),0 0 35px rgba(183,255,60,.16)}
.card:nth-child(3) .number{color:#fff;text-shadow:5px 5px 0 rgba(183,255,60,.18),0 0 35px rgba(8,201,244,.18)}
.visual .tag{position:absolute;z-index:2;top:16px;left:16px;padding:6px 9px;border:1px solid rgba(8,201,244,.7);background:rgba(4,12,20,.78);color:var(--cyan);font-size:8px;font-weight:900;letter-spacing:.13em}
.card-body{padding:24px;display:flex;flex-direction:column;flex:1}
.level{color:var(--cyan);font-size:9px;font-weight:900;letter-spacing:.17em}
h3{font-size:31px;letter-spacing:-.06em;margin-top:5px;line-height:1}
.promise{color:var(--white);font-size:13px;font-weight:700;margin-top:10px;min-height:42px}
.objective{display:inline-flex;align-self:flex-start;margin-top:13px;padding:5px 8px;background:rgba(183,255,60,.09);border-left:2px solid var(--lime);color:var(--lime);font-size:8px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.items{list-style:none;margin:20px 0 23px;display:grid;gap:10px}
.items li{font-size:11px;color:#dce5ee;display:flex;gap:9px;align-items:flex-start}
.items li:before{content:"+";font-weight:900;color:var(--cyan);font-size:14px;line-height:1}
.digital{border-top:1px solid var(--line);padding-top:16px;margin-top:auto}
.digital strong{font-size:9px;color:var(--lime);letter-spacing:.13em}
.digital p{font-size:11px;color:var(--muted);margin-top:6px}
.cta{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:10px 14px;background:var(--cyan);color:var(--ink);font-size:9px;font-weight:900;letter-spacing:.09em;text-align:center;text-transform:uppercase;transition:background .2s ease,transform .2s ease}
.cta:after{content:"↗";font-size:15px}.cta:hover{background:var(--white);transform:translateY(-2px)}
.cta:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:4px}
.cta.is-soon{background:rgba(255,255,255,.045);border:1px dashed rgba(255,255,255,.22);color:#aab7c5;cursor:default;letter-spacing:.08em}
.cta.is-soon:after{content:"·";color:var(--lime)}
.cta.is-soon:hover{background:rgba(255,255,255,.045);transform:none}
.featured .cta{background:var(--lime)}.featured .cta:hover{background:#fff}
.launch{position:relative;overflow:hidden;max-width:900px;margin:0 auto 76px;padding:25px 28px;border:1px solid rgba(8,201,244,.35);background:linear-gradient(110deg,rgba(8,201,244,.09),rgba(13,23,36,.9) 55%);display:grid;grid-template-columns:auto 1fr;gap:17px;align-items:start}
.launch-mark{font-family:"Permanent Marker",cursive;font-size:30px;color:var(--lime);line-height:1;transform:rotate(-5deg)}
.launch strong{display:block;color:var(--cyan);font-size:10px;letter-spacing:.15em}
.launch p{font-size:11px;color:var(--muted);margin-top:7px}
.steps{padding:65px 0 75px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.steps-head{max-width:650px}.steps h2{font-size:clamp(29px,4vw,43px);line-height:1;letter-spacing:-.06em;margin-top:12px}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px}
.step{border-top:2px solid var(--cyan);padding:17px 0 0}
.step:nth-child(2){border-color:var(--lime)}
.step .step-no{font-family:"Permanent Marker",cursive;color:var(--cyan);font-size:23px}
.step b{display:block;font-size:11px;letter-spacing:.1em;margin-top:7px}
.step p{font-size:11px;color:var(--muted);margin-top:7px;max-width:290px}
.closing{padding:70px 20px;text-align:center;background:radial-gradient(ellipse at 50% 100%,rgba(8,201,244,.12),transparent 60%)}
.closing h2{font-size:clamp(30px,5vw,52px);line-height:.98;letter-spacing:-.06em;margin:13px 0}
.closing h2 span{color:var(--lime);font-family:"Permanent Marker",cursive;font-weight:400}
.closing p{max-width:540px;margin:0 auto 22px;color:var(--muted);font-size:13px}
footer{border-top:1px solid var(--line);padding:25px 18px;text-align:center;color:var(--muted);font-size:9px;letter-spacing:.12em}
@media(max-width:900px){.systems{grid-template-columns:1fr;max-width:620px;margin:auto;gap:16px}.card.featured{transform:none;order:-1}.visual{height:185px}.visual .number{font-size:100px}.card-body{padding:23px}.promise{min-height:0}.intro{align-items:flex-start;flex-direction:column;gap:14px}.intro p{max-width:600px}.choose-note{display:block;color:var(--lime);font-size:11px;font-weight:800;margin-top:10px;letter-spacing:.02em}}
@media(max-width:600px){.topline{font-size:8px;letter-spacing:.1em}.wrap{width:calc(100% - 32px)}header{height:auto;min-height:68px;align-items:flex-start;flex-direction:column;justify-content:center;gap:9px;padding:12px 18px}nav{width:100%;justify-content:space-between;gap:8px;font-size:8px}.nav-home{padding:7px 9px}.hero{padding:76px 18px 65px}.hero-copy{font-size:13px}.hero-actions{flex-direction:column;align-items:stretch;max-width:340px;margin:25px auto 0}.btn{width:100%;min-height:50px}.intro{padding:58px 0 20px}.systems{padding-top:10px;padding-bottom:54px}.visual{height:165px}.visual .number{font-size:88px}.card-body{padding:20px}.card.featured:after{font-size:7px;top:16px;right:-35px}.launch{grid-template-columns:1fr;gap:12px;padding:21px;margin-bottom:55px}.launch-mark{font-size:26px}.steps{padding:54px 0}.steps-grid{grid-template-columns:1fr;gap:23px}.step{padding-top:12px}.closing{padding:56px 18px}}
@media(max-width:420px){.card-body{padding:18px}.cta{font-size:8px;letter-spacing:.06em;padding:10px}.objective{font-size:7px}.launch{width:100%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
