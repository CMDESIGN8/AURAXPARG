<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA XP PRO · PERFORMANCE CLUB</title>
<meta name="description" content="AURA XP PRO Performance Club: tu experiencia interactiva de entrenamiento de futsal de 21 días.">
<meta name="theme-color" content="#060b12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b12;--panel:#0d1724;--panel2:#111f30;--cyan:#08c9f4;--lime:#b7ff3c;--white:#f4f8fc;--muted:#9aadc0;--line:rgba(255,255,255,.11)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:Montserrat,Arial,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
.top{padding:9px 16px;text-align:center;background:var(--cyan);color:#041019;font-size:10px;font-weight:900;letter-spacing:.16em}
header{height:68px;padding:0 max(5vw,20px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:rgba(6,11,18,.94);backdrop-filter:blur(12px)}
.brand{font-weight:900;font-size:22px;letter-spacing:-.06em}.brand span{color:var(--cyan)}
nav{display:flex;gap:22px;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
nav a:hover{color:var(--cyan)}
.wrap{width:min(1120px,calc(100% - 36px));margin:auto}
.hero{padding:76px 18px 55px;background:radial-gradient(ellipse at 50% 0,rgba(8,201,244,.2),transparent 62%),linear-gradient(180deg,#0b1928,#060b12);text-align:center}
.kicker{color:var(--cyan);font-size:10px;font-weight:900;letter-spacing:.2em}
h1{font-size:clamp(43px,8vw,82px);line-height:.9;letter-spacing:-.075em;margin:17px auto;max-width:900px}
h1 span{color:var(--cyan)}
.hero p{max-width:650px;margin:auto;color:var(--muted);font-size:13px}
.metrics{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:28px auto 0}
.metric{border:1px solid var(--line);background:rgba(0,0,0,.22);padding:10px 16px;min-width:112px}
.metric b{display:block;font-size:20px;color:var(--lime);line-height:1.1}.metric small{font-size:8px;letter-spacing:.13em;color:var(--muted);font-weight:800}
.progress-wrap{margin:30px auto 0;max-width:520px;text-align:left}
.progress-head{display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:.08em;margin-bottom:8px}
.progress-track{height:7px;background:#1b2937;border-radius:20px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .25s}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.btn{border:1px solid var(--cyan);background:var(--cyan);color:#031018;padding:11px 16px;font:900 10px Montserrat;letter-spacing:.1em;cursor:pointer}
.btn.secondary{background:transparent;color:var(--white);border-color:var(--line)}
.section-head{padding:54px 0 18px}
.section-head h2{font-size:clamp(25px,4vw,38px);letter-spacing:-.055em;line-height:1}
.section-head p{color:var(--muted);font-size:12px;max-width:700px;margin-top:10px}
.weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.week{border:1px solid var(--line);background:var(--panel);padding:15px}
.week b{font-size:11px;color:var(--cyan);letter-spacing:.1em}.week strong{display:block;margin-top:4px;font-size:15px}.week p{color:var(--muted);font-size:10px;margin-top:5px}
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:70px}
.day{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:19px;position:relative;min-width:0}
.day.done{border-color:rgba(183,255,60,.55);background:linear-gradient(145deg,rgba(183,255,60,.09),var(--panel))}
.day-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.day-num{font-size:9px;font-weight:900;letter-spacing:.15em;color:var(--cyan)}
.pill{font-size:8px;font-weight:900;letter-spacing:.1em;padding:5px 8px;border:1px solid var(--line);color:var(--muted)}
.pill.training{border-color:rgba(8,201,244,.5);color:var(--cyan)}
.pill.recovery{border-color:rgba(183,255,60,.4);color:var(--lime)}
.day h3{font-size:20px;letter-spacing:-.04em;margin:10px 0 5px}
.day .focus{font-size:11px;color:var(--muted);margin-bottom:13px}
.details{border-top:1px solid var(--line);padding-top:12px}
.details b{font-size:9px;letter-spacing:.1em;color:var(--lime);text-transform:uppercase}
.details ul{list-style:none;margin-top:7px;display:grid;gap:6px}
.details li{font-size:11px;color:#dbe5ee;padding-left:13px;position:relative}
.details li:before{content:"›";position:absolute;left:0;color:var(--cyan);font-weight:900}
.dose{margin-top:12px;padding:9px;background:rgba(0,0,0,.2);font-size:10px;color:var(--muted)}
.mark{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:9px;font-weight:900;letter-spacing:.08em;cursor:pointer}
.mark input{accent-color:var(--lime);width:16px;height:16px}
.guidance{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 60px}
.guide{padding:18px;border:1px solid var(--line);background:#0b1420}
.guide h3{font-size:12px;color:var(--cyan);letter-spacing:.1em;margin-bottom:7px}
.guide p,.guide li{font-size:10px;color:var(--muted)}
.guide ul{padding-left:16px;display:grid;gap:5px}
.disclaimer{border-left:3px solid var(--lime);padding:14px 16px;background:rgba(183,255,60,.055);font-size:10px;color:#c6d2dd;margin-bottom:55px}
footer{border-top:1px solid var(--line);padding:25px;text-align:center;color:var(--muted);font-size:9px;letter-spacing:.12em}
@media(max-width:720px){.days{grid-template-columns:1fr}.weeks{grid-template-columns:1fr}.guidance{grid-template-columns:1fr}header{height:auto;min-height:66px;align-items:flex-start;flex-direction:column;justify-content:center;gap:7px;padding:10px 18px}nav{width:100%;justify-content:space-between;gap:8px;font-size:8px}.hero{padding:60px 16px 44px}}
@media print{header,.top,.controls,.mark input{display:none!important}body{background:#fff;color:#111}.hero{background:#fff;color:#111;padding:20px}.hero p,.section-head p,.week p,.day .focus,.details li,.dose,.guide p,.guide li,.disclaimer{color:#333}.day,.week,.guide{break-inside:avoid;background:#fff;border:1px solid #bbb}.days{grid-template-columns:1fr 1fr}.day h3{color:#111}}

/* PERFORMANCE CLUB EXPERIENCE */
.club-shell{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin:24px 0 18px}
.club-main,.club-side{border:1px solid var(--line);background:linear-gradient(145deg,#102338,#0a1420);padding:20px;position:relative;overflow:hidden}
.club-main:after{content:"XP";position:absolute;right:15px;bottom:-38px;font-size:140px;font-weight:900;color:rgba(8,201,244,.055);letter-spacing:-.1em;pointer-events:none}
.club-label{font-size:9px;font-weight:900;letter-spacing:.18em;color:var(--cyan)}
.club-main h2{font-size:clamp(24px,4vw,38px);letter-spacing:-.06em;line-height:1;margin:9px 0}
.club-main p{font-size:11px;color:var(--muted);max-width:500px}
.club-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
.club-side{display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.xp-number{font-size:42px;font-weight:900;letter-spacing:-.07em;color:var(--lime);line-height:1}
.xp-caption{font-size:9px;color:var(--muted);letter-spacing:.14em;font-weight:900}
.stat-row{display:flex;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
.stat-row b{color:var(--white);font-size:12px}
.week-filter{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 12px}
.filter-btn{padding:10px 13px;border:1px solid var(--line);background:#0b1420;color:var(--muted);font:900 9px Montserrat;letter-spacing:.1em;cursor:pointer}
.filter-btn.active{background:var(--cyan);border-color:var(--cyan);color:#031018}
.day{transition:border-color .2s,transform .2s}
.day:hover{border-color:rgba(8,201,244,.48);transform:translateY(-2px)}
.day[hidden]{display:none}
.day.next-up{border-color:rgba(183,255,60,.72);box-shadow:0 0 0 1px rgba(183,255,60,.12),0 12px 30px rgba(0,0,0,.22)}
.day.next-up .day-num{color:var(--lime)}
.day:focus-within{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(8,201,244,.12)}
.btn,.filter-btn,.session-toggle{transition:transform .2s ease,background .2s ease,border-color .2s ease,color .2s ease}
.btn:hover,.filter-btn:hover{transform:translateY(-2px)}
.btn:focus-visible,.filter-btn:focus-visible,.session-toggle:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.hero{position:relative;overflow:hidden}
.hero:before{content:"AURA";position:absolute;left:-25px;top:22px;font:clamp(90px,19vw,220px)/1 "Permanent Marker",cursive;color:rgba(8,201,244,.035);transform:rotate(-9deg);pointer-events:none}
.hero .kicker{font-family:"Permanent Marker",cursive;font-size:13px;letter-spacing:.08em;color:var(--lime);transform:rotate(-2deg)}
h1 span{text-shadow:0 0 30px rgba(8,201,244,.22)}
.club-main{border-color:rgba(8,201,244,.36);box-shadow:inset 0 0 34px rgba(8,201,244,.035)}
.club-main:before{content:"";position:absolute;left:20px;top:0;width:90px;height:3px;background:var(--lime);box-shadow:0 0 16px rgba(183,255,60,.4)}
.week{transition:transform .2s ease,border-color .2s ease}
.week:hover{transform:translateY(-3px);border-color:rgba(8,201,244,.45)}
.day .mark input{cursor:pointer}
@media(max-width:420px){.wrap{width:calc(100% - 28px)}.hero{padding:54px 14px 40px}.metric{min-width:calc(33.333% - 8px);padding:9px 7px}.metric b{font-size:18px}.metric small{font-size:7px}.controls{display:grid;grid-template-columns:1fr;width:min(340px,100%);margin-inline:auto}.controls>*{width:100%;text-align:center}.club-side{grid-template-columns:1fr 1fr}.xp-number{font-size:35px}.club-main,.club-side{padding:15px}.week-filter{gap:6px}.filter-btn{font-size:8px;padding:10px 8px}}
.session-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:transparent;color:var(--cyan);font:900 9px Montserrat;letter-spacing:.12em;padding:13px 0 0;cursor:pointer}
.session-toggle span:last-child{font-size:16px;line-height:1}
.day .details,.day .dose{display:none}
.day.expanded .details,.day.expanded .dose{display:block}
.day.expanded .session-toggle span:last-child{transform:none}
.day .mark{padding-top:10px;border-top:1px solid var(--line)}
.day.done .mark{color:var(--lime)}
.day.done .mark:after{content:" +50 XP";color:var(--lime);margin-left:auto}
.next-tag{display:inline-block;font-size:8px;font-weight:900;letter-spacing:.1em;color:#061018;background:var(--lime);padding:5px 7px;margin-left:7px;vertical-align:middle}
.level-track{height:5px;background:#263647;margin-top:9px;overflow:hidden}
.level-track span{display:block;height:100%;width:0;background:var(--lime);transition:width .25s}
.empty-state{display:none;border:1px dashed var(--line);padding:25px;text-align:center;color:var(--muted);font-size:11px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--lime);color:#061018;padding:12px 18px;font-size:10px;font-weight:900;letter-spacing:.1em;z-index:20;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.club-shell{grid-template-columns:1fr}.club-main,.club-side{padding:16px}.club-side{display:grid;grid-template-columns:1fr 1fr}.club-side .xp-block{grid-row:span 2}.filter-btn{flex:1;min-width:calc(50% - 7px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
